# GitHub Actions name
name: Jest automatic tests

on:
  pull_request:
    branches:
      - development
      - staging
      - production

jobs:
  jest-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ${{ secrets.SECRET_DB_TEST_USER }}
          POSTGRES_PASSWORD: ${{ secrets.SECRET_DB_TEST_PASS }}
          POSTGRES_DB: ${{ secrets.SECRET_DB_TEST_DATABASE }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: ${{ secrets.NODE_ENV }}
      SECRET_ADMIN_API: ${{ secrets.SECRET_ADMIN_API }}
      SECRET_EMAIL_RECEIVER: ${{ secrets.SECRET_EMAIL_RECEIVER }}
      SECRET_EMAIL_SENDER: ${{ secrets.SECRET_EMAIL_SENDER }}
      SECRET_EMAIL_PASS: ${{ secrets.SECRET_EMAIL_PASS }}
      SECRET_PRIVATE_KEY_ARTDV: none
      SECRET_PRIVATE_KEY_TAVA: none
      SECRET_BETTERSTACK_LOGGING_KEY: ${{ secrets.SECRET_BETTERSTACK_LOGGING_KEY }}
      SECRET_BETTERSTACK_HOST: ${{ secrets.SECRET_BETTERSTACK_HOST }}
      SECRET_DB_USER: none
      SECRET_DB_PASS: none
      SECRET_DB_HOST: none
      SECRET_DB_PORT: none
      SECRET_DB_DATABASE: none
      SECRET_DB_TEST_USER: ${{ secrets.SECRET_DB_TEST_USER }}
      SECRET_DB_TEST_PASS: ${{ secrets.SECRET_DB_TEST_PASS }}
      SECRET_DB_TEST_HOST: ${{ secrets.SECRET_DB_TEST_HOST }}
      SECRET_DB_TEST_PORT: ${{ secrets.SECRET_DB_TEST_PORT }}
      SECRET_DB_TEST_DATABASE: ${{ secrets.SECRET_DB_TEST_DATABASE }}
      SECRET_TEST_APIKEY_RAW: ${{ secrets.SECRET_TEST_APIKEY_RAW }}
      SECRET_TEST_APIKEY_HASH: ${{ secrets.SECRET_TEST_APIKEY_HASH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
            node-version: 22
            cache: "npm"
            cache-dependency-path: ./backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test
        working-directory: ./backend
